name: CI/CD Pipeline (GitHub Pages Frontend + Render Backend)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: 🧪 Build & Export Static Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Pages Configuration
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript Verification
        run: npm run typecheck

      - name: Build Next.js Static Export
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.page_url }}
        run: npm run build

      - name: Ensure .nojekyll exists
        run: touch ./out/.nojekyll

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy-pages:
    name: 🌐 Deploy Frontend to GitHub Pages Edge CDN
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  trigger-render-deploy:
    name: 🚀 Deploy Backend to Render (Optional)
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Deploy hook secret found. Triggering Render production deployment..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            BODY=$(echo "$RESPONSE" | sed -e '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
            echo "Render API Response: $BODY"
            echo "HTTP Status: $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "✅ Successfully initiated Render deployment!"
            else
              echo "❌ Render deploy hook returned HTTP $STATUS"
              exit 1
            fi
          else
            echo "ℹ️ Note: RENDER_DEPLOY_HOOK_URL is not set."
            echo "ℹ️ Since this is a static frontend running on GitHub Pages CDN, a backend on Render is optional."
          fi
