name: CI/CD Production Pipeline (Render)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-test:
    name: 🧪 Quality Verification & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run TypeScript Verification
        run: npm run typecheck

      - name: Run Next.js Production Build
        run: npm run build

  trigger-render-deploy:
    name: 🚀 Deploy to Render
    needs: validate-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Deploy hook secret found. Triggering Render production deployment..."
            RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "$RENDER_DEPLOY_HOOK")
            BODY=$(echo "$RESPONSE" | sed -e '$d')
            STATUS=$(echo "$RESPONSE" | tail -n1 | cut -d':' -f2)
            echo "Render API Response: $BODY"
            echo "HTTP Status: $STATUS"
            if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
              echo "✅ Successfully initiated Render deployment!"
            else
              echo "❌ Render deploy hook returned HTTP $STATUS"
              exit 1
            fi
          else
            echo "ℹ️ Note: RENDER_DEPLOY_HOOK_URL secret is not set in GitHub repository settings."
            echo "ℹ️ Render will deploy automatically if connected via Render Git auto-deploy (Blueprint), or you can add RENDER_DEPLOY_HOOK_URL in GitHub Secrets for CI/CD webhook triggers."
          fi
